services:
  kafka:
    image: bitnamilegacy/kafka:3.7.0
    container_name: skmb-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - skmb_kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  app:
    build: .
    container_name: skmini-bank-app
    ports:
      - "8082:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTION_TOPIC: bank_transactions
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AADHAAR_PROVIDER_ENDPOINT: ${AADHAAR_PROVIDER_ENDPOINT:-}
      AADHAAR_PROVIDER_CLIENT_ID: ${AADHAAR_PROVIDER_CLIENT_ID:-}
      AADHAAR_PROVIDER_CLIENT_SECRET: ${AADHAAR_PROVIDER_CLIENT_SECRET:-}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skmb_kafka_data:
